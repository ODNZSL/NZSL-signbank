{% load i18n %}
<div class="alert alert-{{ notice.level }} notification" role="alert">
  <a
    class="btn-close notification-close float-end"
    aria-label="Close"
    href="{% url 'notifications:mark_as_read' notice.slug %}"
  ></a>

  <h4>
    <a href="{{ notice.action_object.get_absolute_url }}">
      <span class="bi bi-person-fill" aria-hidden="true"></span>
      {{ notice.actor }}
      {{ notice.verb }}
    </a><span
      class="dataset-{{ notice.action_object.content_object.dataset.id }}-color badge badge-dataset"
      style="font-size: 0.6em"
    >{{ notice.action_object.content_object.dataset }}</span>
  </h4>

  <p><em>{{ notice.timesince }} {% blocktrans %}ago{% endblocktrans %}</em></p>
  <p>{{ notice.description|linebreaksbr }}</p>

  <div class="notice-actions">
    {% for action in notice.data.actions %}
      <a class="btn" href="{{ action.href }}">{{ action.title }}</a>
    {% endfor %}
  </div>
</div>
